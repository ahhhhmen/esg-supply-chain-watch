name: ESG Best Practice Weekly (Practice)

# 配置触发时机
on:
  schedule:
    # 降频：每两周运行一次（周三 UTC 22:00 = 周四 BJT 06:00）
    # 原为每周四运行，降频以控制 API 成本
    - cron: '0 22 */14 * 3'
  workflow_dispatch:
    # 允许在 GitHub 网页端手动点击运行按钮

jobs:
  run-practice-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # 1. 检出仓库代码
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 1.5 恢复 LLM 磁盘缓存（跨运行复用，降低 API 成本）
    - name: Restore LLM Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/radar-infra/llm_cache
        key: llm-cache-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('**/esg_sources.yaml') }}
        restore-keys: |
          llm-cache-${{ runner.os }}-${{ github.repository }}-
          llm-cache-${{ runner.os }}-

    # 2. 部署 Python 3.10 环境
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 执行同业良好实践情报检索（--mode practice）
    - name: Execute ESG Intelligence Agent (Practice)
      env:
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_PRACTICE_DATABASE_ID: ${{ secrets.NOTION_PRACTICE_DATABASE_ID }}
      run: |
        python esg_intelligence_agent.py --mode practice

    # 5. 自动化成果回传（将新生成的 Practice 报告推回仓库）
    - name: Commit and Push Practice Report
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 检查报告文件和去重记忆库是否有更新
        if [ -f "esg_practice_report.md" ]; then
          git add esg_practice_report.md
        fi
        if [ -f "logs/processed_urls.json" ]; then
          git add logs/processed_urls.json
        fi
        if [ -f "metrics.jsonl" ]; then
          git add metrics.jsonl
        fi
        if ls logs/run_*.log >/dev/null 2>&1; then
          git add logs/run_*.log
        fi
        
        git diff-index --quiet HEAD || git commit -m "🌱 每周自动更新: 同业良好实践周报与去重记忆库 ($(date +'%Y-%m-%d %H:%M'))"
        git push
